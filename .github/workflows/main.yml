name: Bygg och testa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Backend-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: End-to-end-test mot simulerad Xtream-server
        run: python tests/test_e2e.py

  android:
    name: Android-app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signeringsnyckel
        env:
          KEYSTORE_BASE64: ${{ secrets.TVHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tvhub.jks"
            echo "TVHUB_KEYSTORE=$RUNNER_TEMP/tvhub.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Ingen signeringsnyckel. APK:n signeras med en tillfällig nyckel och kan inte uppdatera en tidigare installation."
          fi

      - name: Bygg APK
        working-directory: android
        env:
          TVHUB_KEYSTORE_PASSWORD: ${{ secrets.TVHUB_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.3.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Samla APK och versionsfil
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk tvhub.apk
          echo "{\"versionCode\": ${{ github.run_number }}, \"versionName\": \"1.3.${{ github.run_number }}\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: tvhub-apk
          path: tvhub.apk

      - name: Publicera på fast adress
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: TV Hub-appen (senaste)
          body: "Boxarna uppdaterar sig själva via Home Assistant. Första installationen: ladda ner tvhub.apk med appen Downloader. Version 1.3.${{ github.run_number }}."
          files: |
            tvhub.apk
            version.json
          prerelease: true
          make_latest: false
